<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>
window.onerror=function(m,s,l,c){if(/^Script error\.?$/.test(String(m))&&!l)return true;try{var d=document.getElementById('err');if(!d){d=document.createElement('pre');d.id='err';
d.onclick=function(){d.remove()};d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99;margin:0;padding:14px 12px 30px;background:#a00;color:#fff;font:14px Menlo,monospace;white-space:pre-wrap';
(document.body||document.documentElement).appendChild(d);}d.textContent+='FEHLER: '+m+' (Zeile '+l+':'+c+')\n';
var b=document.getElementById('boot');if(b)b.remove();}catch(e){}};
window.addEventListener('unhandledrejection',function(e){window.onerror('Promise: '+(e.reason&&e.reason.message||e.reason),'',0,0);});
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>WETTER.EXE</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#0000aa;--fg:#aaaaaa;--hi:#ffffff;--cy:#00aaaa;--lcy:#55ffff;--ye:#ffff55;--rd:#ff5555;--gr:#55ff55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000}
body{font-family:'VT323',ui-monospace,Menlo,monospace;font-size:21px;line-height:1.15;color:var(--fg);
  -webkit-text-size-adjust:100%;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;background:var(--bg)}
.hidden{display:none!important}
.bar{background:var(--fg);color:#000;padding:2px 8px;display:flex;justify-content:space-between;white-space:nowrap}
.bar .demo{color:#aa0000}
fieldset{min-width:0;flex:1;margin:4px 6px 2px;border:4px double var(--hi);padding:2px 6px 6px;overflow:auto;min-height:0}
legend{color:var(--hi);padding:0 6px;background:var(--bg)}
.row{display:grid;grid-template-columns:1.6em minmax(0,1fr) 3.4em 5.6em;gap:6px;padding:1px 3px;white-space:nowrap;cursor:pointer}
.row>span{overflow:hidden;text-overflow:clip}
.row.head{color:var(--ye);cursor:default;border-bottom:1px dashed var(--fg)}
.row.free{color:#6a6ac8}
.row.free>span:nth-child(2){grid-column:2/-1}
.city{cursor:pointer;padding:3px 0 5px;border-bottom:1px dotted #3a3aa0}
.city:active{background:var(--cy)}
.city:active .row,.city:active .fc span{color:#000}
.city .row{cursor:pointer}
.fc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:0 3px;font-size:17px;color:var(--fg);white-space:nowrap}
.fc span{overflow:hidden}
.fc b{color:var(--ye);font-weight:normal}
.fc i{color:var(--hi);font-style:normal}
.row.free{padding:6px 3px 14px}
.row .t{text-align:right;color:var(--hi)}
.row .c{color:var(--lcy)}
.row.err .c{color:var(--rd)}
#log{padding:2px 10px;min-height:3.6em;max-height:5.8em;overflow:hidden;white-space:pre-wrap;color:var(--fg)}
#log .e{color:var(--rd)} #log .ok{color:var(--gr)} #log .i{color:var(--ye)}
.cmd{display:flex;align-items:center;background:#000;padding:6px 10px;color:var(--fg)}
.cmd input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--hi);font:inherit;font-size:21px;caret-color:var(--hi);padding:0 0 0 4px;text-transform:uppercase;border-radius:0}
.fkeys{display:grid;grid-template-columns:repeat(4,1fr);background:#000;gap:2px;padding:2px 2px 4px}
.fkeys button{font:inherit;font-size:18px;background:#000;color:var(--hi);border:0;padding:6px 0;text-align:left;white-space:nowrap;overflow:hidden;cursor:pointer;border-radius:0}
.fkeys button span{background:var(--cy);color:#000;padding:0 3px}
.fkeys button:active span{background:var(--ye)}
/* Detail */
.gbwrap{background:#2a2a35;padding:10px 12px 14px;border-radius:6px 6px 26px 6px;margin:2px 0 6px;box-shadow:inset 0 0 0 2px #111}
.gbwrap .lbl{font-size:15px;color:#8888aa;letter-spacing:2px;margin-top:6px;text-align:center}
canvas#gb{display:block;width:100%;aspect-ratio:160/144;image-rendering:pixelated;image-rendering:crisp-edges;background:#9bbc0f;border:3px solid #111}
pre.info{margin:0;font:inherit;white-space:pre-wrap;color:var(--fg)}
pre.info b{color:var(--hi);font-weight:normal} pre.info i{color:var(--lcy);font-style:normal} pre.info u{color:var(--ye);text-decoration:none}
/* Boot */
.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
</style>
</head>
<body>

<!-- Hauptliste -->
<div class="screen" id="main">
  <div class="bar"><span>WETTER.EXE <span class="demo" id="demoTag"></span></span><span id="clock">--:--</span></div>
  <fieldset>
    <legend>[ STÄDTE 0/5 ]</legend>
    <div id="list"></div>
  </fieldset>
  <div id="log"></div>
  <form class="cmd" id="cmdForm" autocomplete="off">
    <span>C:\WETTER&gt;</span><input id="cmd" enterkeyhint="go" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="">
  </form>
  <div class="fkeys">
    <button data-k="help"><span>F1</span>Hilfe</button>
    <button data-k="new"><span>F2</span>Neu</button>
    <button data-k="refresh"><span>F5</span>Aktual.</button>
    <button data-k="del"><span>F8</span>Lösch.</button>
  </div>
</div>

<!-- Detailansicht -->
<div class="screen hidden" id="detail">
  <div class="bar"><span id="dTitle">STADT.DAT</span><span id="clock2">--:--</span></div>
  <fieldset>
    <legend id="dLegend">[ ]</legend>
    <div class="gbwrap"><canvas id="gb" width="160" height="144"></canvas><div class="lbl">PIXEL-WETTER 4-SHADE</div></div>
    <pre class="info" id="dInfo"></pre>
  </fieldset>
  <div class="fkeys">
    <button data-k="back"><span>ESC</span>Zurück</button>
    <button data-k="drefresh"><span>F5</span>Aktual.</button>
    <button data-k="preview"><span>F7</span>Demo</button>
    <button data-k="ddel" id="ddel"><span>F8</span>Lösch.</button>
  </div>
</div>

<script>
'use strict';
/* ================= Daten & Speicher ================= */
const MAX = 5;
const LS_C = 'wetterdos.cities', LS_D = 'wetterdos.data';
const SANDBOX = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
// Speicher: in Scriptable über eine Brücke (window.__INIT__), sonst localStorage
const BRIDGE = (typeof window.__INIT__ === 'object' && window.__INIT__) ? window.__INIT__ : null;
const LS_TS = 'wetterdos.ts';
function lsRaw(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : undefined; } catch (e) { return undefined; } }
// neuere Quelle gewinnt: Scriptable-Datei oder localStorage
const USE_LS = !BRIDGE || (lsRaw(LS_TS) || 0) > (BRIDGE[LS_TS] || 0);
let demo = false;
let cities = lsGet(LS_C, []);
let wx = lsGet(LS_D, {});
if (cities.length > MAX) { cities = cities.slice(0, MAX); }          // id -> Wetterdaten
let current = -1;                  // geöffnete Stadt in Detailansicht

function lsGet(k, d) {
  if (!USE_LS && BRIDGE[k] !== undefined) return BRIDGE[k];
  const v = lsRaw(k); return v === undefined ? d : v;
}
function lsSet(k, v) {
  const ts = Date.now();
  if (BRIDGE) { BRIDGE[k] = v; BRIDGE[LS_TS] = ts; }
  try { localStorage.setItem(k, JSON.stringify(v)); localStorage.setItem(LS_TS, String(ts)); } catch (e) {}
}
function save() { lsSet(LS_C, cities); lsSet(LS_D, wx); }
window.__getState = () => JSON.stringify({[LS_C]: cities, [LS_D]: wx, [LS_TS]: Date.now()});
const $ = id => document.getElementById(id);

/* ================= Wettercodes (WMO) ================= */
const LONG = {0:'Klar',1:'Heiter',2:'Wolkig',3:'Bedeckt',45:'Nebel',48:'Reifnebel',51:'Leichter Niesel',53:'Niesel',55:'Starker Niesel',
  56:'Gefr. Niesel',57:'Gefr. Niesel',61:'Leichter Regen',63:'Regen',65:'Starkregen',66:'Eisregen',67:'Eisregen',
  71:'Leichter Schnee',73:'Schnee',75:'Starker Schnee',77:'Schneegriesel',80:'Regenschauer',81:'Regenschauer',82:'Heftige Schauer',
  85:'Schneeschauer',86:'Schneeschauer',95:'Gewitter',96:'Gewitter+Hagel',99:'Gewitter+Hagel'};
function category(c) {
  if (c === 0) return 'clear';
  if (c <= 2) return 'partly';
  if (c === 3) return 'cloudy';
  if (c === 45 || c === 48) return 'fog';
  if (c >= 51 && c <= 57) return 'drizzle';
  if ((c >= 61 && c <= 67) || (c >= 80 && c <= 82)) return 'rain';
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return 'snow';
  if (c >= 95) return 'thunder';
  return 'cloudy';
}
const SHORT = {clear:'Sonnig',partly:'Heiter',cloudy:'Bedeckt',fog:'Nebel',drizzle:'Niesel',rain:'Regen',snow:'Schnee',thunder:'Gewitter'};
function shortTxt(w) { const c = category(w.code); return (c === 'clear' && !w.isDay) ? 'Klar' : SHORT[c]; }
function longTxt(w) { return (w.code === 0 && w.isDay) ? 'Sonnig' : (LONG[w.code] || 'Unbekannt'); }

/* ================= Netzwerk ================= */
async function getJSON(url) {
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 9000);
  try { const r = await fetch(url, {signal: ctl.signal}); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(to); }
}
function setDemo() {
  if (demo) return; demo = true; $('demoTag').textContent = '[DEMO]';
  log('Kein Netzzugriff in dieser Vorschau -> DEMO-Daten.', 'i');
}
async function geocode(name) {
  if (!demo) {
    try {
      const j = await getJSON('https://geocoding-api.open-meteo.com/v1/search?count=1&language=de&format=json&name=' + encodeURIComponent(name));
      if (!j.results || !j.results.length) return null;
      const r = j.results[0];
      return {id: String(r.id || (r.latitude + ',' + r.longitude)), name: r.name, cc: (r.country_code || '').toUpperCase(), country: r.country || '', lat: r.latitude, lon: r.longitude};
    } catch (e) { if (SANDBOX) setDemo(); else throw e; }
  }
  const n = name.trim().replace(/\s+/g, ' '); const nn = n.charAt(0).toUpperCase() + n.slice(1).toLowerCase();
  return {id: 'demo-' + nn.toLowerCase(), name: nn, cc: '--', country: 'Demo', lat: 0, lon: 0};
}
async function fetchWeather(c) {
  if (!demo) {
    try {
      const u = 'https://api.open-meteo.com/v1/forecast?latitude=' + c.lat + '&longitude=' + c.lon +
        '&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m' +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=4';
      const j = await getJSON(u); const cu = j.current, d = j.daily;
      return {t: cu.temperature_2m, feel: cu.apparent_temperature, hum: cu.relative_humidity_2m, wind: cu.wind_speed_10m,
        code: cu.weather_code, isDay: !!cu.is_day, time: Date.now(),
        days: d.time.map((t, i) => ({date: t, code: d.weather_code[i], max: d.temperature_2m_max[i], min: d.temperature_2m_min[i]}))};
    } catch (e) { if (SANDBOX) setDemo(); else throw e; }
  }
  return fakeWeather(c);
}
function hash(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function fakeWeather(c) {
  const codes = [0, 61, 71, 95, 2, 45, 3, 53, 80, 1];
  const idx = cities.findIndex(x => x.id === c.id);
  const h = hash(c.name); const code = codes[(idx >= 0 ? idx : h) % codes.length];
  const cat = category(code);
  const base = cat === 'snow' ? -3 : cat === 'clear' ? 24 : 6 + (h % 12);
  const hr = new Date().getHours();
  const days = []; for (let i = 0; i < 4; i++) { const dt = new Date(Date.now() + i * 864e5);
    days.push({date: dt.toISOString().slice(0, 10), code: codes[(h + i * 3) % codes.length], max: base + 3 + (i * 7 + h) % 5, min: base - 4 - (i * 3 + h) % 4}); }
  days[0].code = code;
  return {t: base + (h % 10) / 10, feel: base - 2, hum: 40 + h % 55, wind: 3 + h % 35, code, isDay: hr >= 7 && hr < 19, time: Date.now(), days, demo: true};
}

/* ================= UI: Liste & Log ================= */
const logLines = [];
function log(msg, cls) { logLines.push({msg, cls}); while (logLines.length > 4) logLines.shift(); drawLog(); }
function drawLog() { const el = $('log'); el.textContent = ''; for (const l of logLines) { const d = document.createElement('div'); if (l.cls) d.className = l.cls; d.textContent = l.msg; el.appendChild(d); } }
function fmtT(t) { return (t == null || isNaN(t)) ? '--' : Math.round(t) + '°'; }
function span(txt, cls) { const s = document.createElement('span'); s.textContent = txt; if (cls) s.className = cls; return s; }

const WD2 = ['SO', 'MO', 'DI', 'MI', 'DO', 'FR', 'SA'];
const FC = {clear: 'Son', partly: 'Hei', cloudy: 'Wol', fog: 'Neb', drizzle: 'Nie', rain: 'Reg', snow: 'Sch', thunder: 'Gew'};
function fcCell(d) {
  const s = document.createElement('span'); const dt = new Date(d.date + 'T12:00');
  const b = document.createElement('b'); b.textContent = WD2[dt.getDay()] + ' ';
  const i = document.createElement('i'); i.textContent = Math.round(d.max) + '/' + Math.round(d.min) + ' ';
  s.append(b, i, document.createTextNode(FC[category(d.code)])); return s;
}
function render() {
  const L = $('list'); L.textContent = '';
  document.querySelector('#main legend').textContent = `[ STÄDTE ${cities.length}/${MAX} ]`;
  const head = document.createElement('div'); head.className = 'row head';
  ['NR', 'STADT', 'TEMP', 'WETTER'].forEach((t, i) => head.appendChild(span(t, i === 2 ? 't' : '')));
  head.children[2].style.color = 'inherit'; L.appendChild(head);
  for (let i = 0; i < MAX; i++) {
    const c = cities[i]; const nr = String(i + 1).padStart(2, '0');
    const r = document.createElement('div'); r.className = 'row';
    if (!c) { r.classList.add('free'); r.append(span(nr), span('-- frei --')); r.onclick = () => fkey('new'); L.appendChild(r); continue; }
    const w = wx[c.id];
    r.append(span(nr), span(c.name.toUpperCase()), span(w ? fmtT(w.t) : '..', 't'), span(w ? shortTxt(w) : (c.err ? 'FEHLER' : 'lade...'), 'c'));
    if (c.err && !w) r.classList.add('err');
    const box = document.createElement('div'); box.className = 'city'; box.appendChild(r);
    const fc = document.createElement('div'); fc.className = 'fc';
    if (w && w.days && w.days.length > 1) w.days.slice(1, 4).forEach(d => fc.appendChild(fcCell(d)));
    else fc.appendChild(span('Vorhersage folgt…'));
    box.appendChild(fc);
    box.onclick = () => openDetail(i); L.appendChild(box);
  }
}

/* ================= Befehle ================= */
async function addCity(name) {
  if (!name) { log('Syntax: NEU <Stadt>', 'e'); return; }
  if (cities.length >= MAX) { log('Speicher voll: max. 5 Städte. DEL <nr> zum Löschen.', 'e'); return; }
  log('Suche "' + name + '" ...');
  let g;
  try { g = await geocode(name); } catch (e) { log('Netzwerkfehler. Bist du online?', 'e'); return; }
  if (!g) { log('Stadt nicht gefunden: ' + name, 'e'); return; }
  if (cities.some(c => c.id === g.id)) { log(g.name + ' ist schon in der Liste.', 'e'); return; }
  cities.push(g); save(); render();
  log(g.name + (g.country && g.country !== 'Demo' ? ', ' + g.country : '') + ' hinzugefügt.', 'ok');
  await refreshCity(g);
}
async function refreshCity(c) {
  try { wx[c.id] = await fetchWeather(c); c.err = false; }
  catch (e) { c.err = true; }
  save(); render(); if (current >= 0 && cities[current] === c) showDetailInfo();
}
async function refreshAll() {
  if (!cities.length) { log('Keine Städte. Tippe: NEU BERLIN', 'i'); return; }
  log('Aktualisiere ' + cities.length + ' Stadt/Städte ...');
  await Promise.all(cities.map(refreshCity));
  const bad = cities.filter(c => c.err).length;
  log(bad ? bad + ' Fehler beim Abruf (alte Daten bleiben).' : 'OK. Stand ' + hhmm(new Date()) + ' Uhr.', bad ? 'e' : 'ok');
}
function delCity(n) {
  if (!(n >= 1 && n <= cities.length)) { log('Syntax: DEL <nr>  (1-' + Math.max(cities.length, 1) + ')', 'e'); return false; }
  const c = cities.splice(n - 1, 1)[0]; delete wx[c.id]; save(); render();
  log(c.name + ' gelöscht.', 'ok'); return true;
}
function help() {
  log('NEU <stadt>  DEL <nr>  <nr> = Details', 'i');
  log('AKTUAL  DIR  CLS  VER  ·  Zeile antippen', 'i');
}
function run(line) {
  line = line.trim(); if (!line) return;
  const parts = line.split(/\s+/); const cmd = parts[0].toUpperCase(); const arg = parts.slice(1).join(' ');
  switch (cmd) {
    case 'NEU': case 'ADD': case 'N': addCity(arg); break;
    case 'DEL': case 'DELETE': case 'LÖSCH': case 'LOESCH': case 'RM': delCity(parseInt(arg, 10)); break;
    case 'AKTUAL': case 'R': case 'REFRESH': case 'F5': refreshAll(); break;
    case 'HILFE': case 'HELP': case '?': help(); break;
    case 'CLS': logLines.length = 0; drawLog(); break;
    case 'DIR': case 'LS':
      log(cities.length ? cities.map((c, i) => (i + 1) + ':' + c.name.toUpperCase()).join('  ') : 'Datei nicht gefunden', 'i');
      log(cities.length + ' Datei(en)   ' + (MAX - cities.length) + ' Plätze frei'); break;
    case 'VER': log('WETTER-DOS Version 1.0  ·  Daten: Open-Meteo.com', 'i'); break;
    case 'EXIT': log('Wohin denn? Hier ist es doch schön.', 'i'); break;
    default:
      if (/^\d+$/.test(cmd)) { const n = +cmd; if (n >= 1 && n <= cities.length) openDetail(n - 1); else log('Ungültige Nummer.', 'e'); }
      else { log('Befehl oder Dateiname nicht gefunden.', 'e'); log('Tipp: NEU ' + line, 'i'); }
  }
}
$('cmdForm').addEventListener('submit', e => { e.preventDefault(); const v = $('cmd').value; $('cmd').value = ''; log('C:\\WETTER>' + v.toUpperCase()); run(v); });

function fkey(k) {
  const inp = $('cmd');
  switch (k) {
    case 'help': help(); break;
    case 'new': inp.value = 'NEU '; inp.focus(); break;
    case 'refresh': refreshAll(); break;
    case 'del': inp.value = 'DEL '; inp.focus(); break;
    case 'back': closeDetail(); break;
    case 'drefresh': if (cities[current]) { log('Aktualisiere ' + cities[current].name + ' ...'); refreshCity(cities[current]); } break;
    case 'preview': cyclePreview(); break;
    case 'ddel': confirmDelete(); break;
  }
}
document.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => fkey(b.dataset.k)));
document.addEventListener('keydown', e => {
  const map = {F1: 'help', F2: 'new', F5: 'refresh', F8: 'del'};
  if (!$('detail').classList.contains('hidden')) {
    if (e.key === 'Escape') { closeDetail(); e.preventDefault(); }
    else if (e.key === 'F7') { cyclePreview(); e.preventDefault(); }
    else if (e.key === 'F5') { fkey('drefresh'); e.preventDefault(); }
    return;
  }
  if (map[e.key]) { fkey(map[e.key]); e.preventDefault(); }
});

/* ================= Detailansicht ================= */
let preview = null, delArmed = 0;
const CATS = ['clear', 'partly', 'cloudy', 'fog', 'drizzle', 'rain', 'snow', 'thunder'];
function openDetail(i) {
  current = i; preview = null; delArmed = 0; $('ddel').innerHTML = '<span>F8</span>Lösch.';
  $('main').classList.add('hidden'); $('detail').classList.remove('hidden');
  const c = cities[i];
  $('dTitle').textContent = c.name.toUpperCase().replace(/[^A-Z0-9ÄÖÜ]/g, '').slice(0, 8) + '.DAT';
  $('dLegend').textContent = '[ ' + c.name.toUpperCase() + ' ]';
  resetScene(); showDetailInfo(); startAnim();
}
function closeDetail() { stopAnim(); current = -1; $('detail').classList.add('hidden'); $('main').classList.remove('hidden'); render(); }
function confirmDelete() {
  if (current < 0) return;
  if (Date.now() - delArmed < 3000) { const n = current + 1; closeDetail(); delCity(n); return; }
  delArmed = Date.now(); $('ddel').innerHTML = '<span>F8</span>Sicher?';
  setTimeout(() => { if (Date.now() - delArmed >= 3000) $('ddel').innerHTML = '<span>F8</span>Lösch.'; }, 3100);
}
function cyclePreview() {
  const i = preview === null ? 0 : CATS.indexOf(preview) + 1;
  preview = i >= CATS.length ? null : CATS[i]; resetScene(); showDetailInfo();
}
const WD = ['SO', 'MO', 'DI', 'MI', 'DO', 'FR', 'SA'];
function hhmm(d) { return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function esc(s) { return String(s).replace(/[&<>]/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[m])); }
function showDetailInfo() {
  const c = cities[current]; if (!c) return; const w = wx[c.id];
  const el = $('dInfo');
  if (!w) { el.innerHTML = c.err ? '<u>FEHLER:</u> Abruf fehlgeschlagen.\nF5 = nochmal versuchen.' : 'Lade Daten ...<span class="blink">_</span>'; return; }
  const f1 = v => (v == null ? '--' : (Math.round(v * 10) / 10).toFixed(1));
  let s = '';
  s += 'ORT    : <b>' + esc(c.name) + '</b>' + (c.cc && c.cc !== '--' ? ', ' + esc(c.cc) : '') + '\n';
  s += 'TEMP.  : <b>' + f1(w.t) + '°C</b>\n';
  s += 'GEFÜHLT: ' + f1(w.feel) + '°C\n';
  s += 'WETTER : <i>' + esc(longTxt(w)) + '</i>' + (w.isDay ? '' : ' (Nacht)') + '\n';
  s += 'FEUCHTE: ' + Math.round(w.hum) + '%\n';
  s += 'WIND   : ' + Math.round(w.wind) + ' km/h\n';
  if (w.days && w.days.length > 1) {
    s += '<u>── VORHERSAGE ──────</u>\n';
    w.days.slice(1, 4).forEach(d => { const dt = new Date(d.date + 'T12:00');
      s += WD[dt.getDay()] + ' ' + (Math.round(d.max) + '/' + Math.round(d.min) + '°').padEnd(8) + SHORT[category(d.code)] + '\n'; });
  }
  s += '<u>────────────────────</u>\n';
  s += 'STAND ' + hhmm(new Date(w.time)) + ' Uhr' + (w.demo ? ' [DEMO]' : ' Open-Meteo') + '\n';
  if (preview) s += '<u>F7-DEMO: ' + SHORT[preview].toUpperCase() + '</u> (F7 weiter)';
  el.innerHTML = s;
}

/* ================= 4-Shade Pixel-Renderer (160x144) ================= */
const P = ['#9bbc0f', '#8bac0f', '#306230', '#0f380f'];   // hell -> dunkel
const cv = $('gb'); let g = cv.getContext('2d');
function rect(x, y, w, h, c) { g.fillStyle = P[c]; g.fillRect(Math.round(x), Math.round(y), w, h); }
function px(x, y, c) { rect(x, y, 1, 1, c); }

// 3x5 Bitmap-Schrift
const FONT = {
  '0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001',
  '5':'111100111001111','6':'111100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001111',
  A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',
  G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',
  M:'101111101101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',
  S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101101111101',X:'101101010101101',
  Y:'101101010010010',Z:'111001010100111','-':'000000111000000','.':'000000000000010','°':'010101010000000',
  '%':'101001010100101','/':'001001010100100',':':'000010000010000','+':'000010111010000',' ':'000000000000000'
};
function norm(s) {
  return String(s).toUpperCase().replace(/Ä/g, 'AE').replace(/Ö/g, 'OE').replace(/Ü/g, 'UE').replace(/ß/g, 'SS')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function txtW(s, sc = 1) { return norm(s).length * 4 * sc - sc; }
function txt(s, x, y, c, sc = 1) {
  for (const ch of norm(s)) { const gl = FONT[ch] || FONT[' '];
    for (let i = 0; i < 15; i++) if (gl[i] === '1') rect(x + (i % 3) * sc, y + ((i / 3) | 0) * sc, sc, sc, c);
    x += 4 * sc; }
}
function txtShadow(s, x, y, c, sh, sc = 1) { txt(s, x + 1, y + 1, sh, sc); txt(s, x, y, c, sc); }

// Sprites aus Kreisen (Wolken, Büsche) – vorgerendert
function blob(circles, fill, out, shade) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [cx, cy, r] of circles) { x0 = Math.min(x0, cx - r); y0 = Math.min(y0, cy - r); x1 = Math.max(x1, cx + r); y1 = Math.max(y1, cy + r); }
  const w = x1 - x0 + 3, h = y1 - y0 + 3; const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  const inside = (a, b) => circles.some(([cx, cy, r]) => (a + x0 - 1 - cx) ** 2 + (b + y0 - 1 - cy) ** 2 <= r * r);
  for (let b = 0; b < h; b++) for (let a = 0; a < w; a++) {
    if (!inside(a, b)) continue;
    const edge = !inside(a - 1, b) || !inside(a + 1, b) || !inside(a, b - 1) || !inside(a, b + 1);
    const col = edge ? out : (b > h * 0.66 ? shade : fill);
    if (col < 0) continue; x.fillStyle = P[col]; x.fillRect(a, b, 1, 1);
  }
  return c;
}
const CLOUD = [[8, 9, 6], [16, 6, 7], [25, 8, 6], [13, 11, 5], [21, 11, 5]];
const CLOUD2 = [[6, 7, 5], [13, 5, 6], [19, 8, 5]];
const SPR = {
  cDay: blob(CLOUD, 0, 3, 1), cDay2: blob(CLOUD2, 0, 3, 1),
  cGrey: blob(CLOUD, 1, 3, 2), cGrey2: blob(CLOUD2, 1, 3, 2),
  cStorm: blob(CLOUD, 2, 3, 3), cStorm2: blob(CLOUD2, 2, 3, 3),
  cNight: blob(CLOUD, 2, 1, 3), cNight2: blob(CLOUD2, 2, 1, 3),
  bush: blob([[5, 7, 5], [11, 5, 6], [17, 7, 5]], 2, 3, 3), bushN: blob([[5, 7, 5], [11, 5, 6], [17, 7, 5]], 3, 2, 3),
  fog: (() => { const c = document.createElement('canvas'); c.width = 240; c.height = 70; const x = c.getContext('2d'); x.fillStyle = P[0];
    for (let y = 0; y < 70; y++) { const band = Math.sin(y / 5) + Math.sin(y / 13);
      for (let a = 0; a < 240; a++) { const n = band + Math.sin(a / 17 + y / 9) * 0.8;
        if (n > 0.2 && ((a + y) & 1) === 0) x.fillRect(a, y, 1, 1); else if (n > 1.2) x.fillRect(a, y, 1, 1); } }
    return c; })()
};
// Original-Figur "BIT" – kleiner Wetter-Roboter (8x10)
const BOT = {
  head: ['....3...', '..33333.', '.3000003', '.3030303', '.3000003', '.3033303', '..33333.', '..32223.'],
  legA: ['..3...3.', '.33...33'], legB: ['...3.3..', '..33.33.']
};
const UMB = ['....3333....', '..33222233..', '.3222222223.', '333333333333'];
function sprite(rows, x, y, map) {
  rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) { const ch = r[i]; if (ch === '.') continue; px(x + i, y + j, map ? map[+ch] : +ch); } });
}

let S = {};   // Szenen-Zustand
function resetScene() {
  const parts = []; for (let i = 0; i < 120; i++) parts.push({x: Math.random() * 200, y: Math.random() * 130, s: 0.6 + Math.random() * 0.8});
  const stars = []; for (let i = 0; i < 22; i++) stars.push({x: (Math.random() * 158) | 0, y: 18 + ((Math.random() * 60) | 0)});
  S = {f: 0, parts, stars, flash: 0, bolt: null};
}
function circle(cx, cy, r, fn) { for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) { const d = dx * dx + dy * dy; if (d <= r * r) fn(cx + dx, cy + dy, d); } }
function drawSun(cx, cy, f) {
  const ph = (f >> 3) & 1;
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 + (ph ? Math.PI / 8 : 0);
    for (let d = 11; d <= 14 + ph; d++) px(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 2); }
  circle(cx, cy, 8, (x, y, d) => px(x, y, d > 52 ? 2 : 1));
  px(cx - 4, cy - 4, 0); px(cx - 3, cy - 4, 0); px(cx - 4, cy - 3, 0);
}
function drawMoon(cx, cy) { circle(cx, cy, 7, (x, y) => { if ((x - cx - 4) ** 2 + (y - cy + 2) ** 2 > 36) px(x, y, 0); }); }
function line(x0, y0, x1, y1, c, w = 1) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0;
  for (let i = 0; i <= n; i++) { const t = n ? i / n : 0; rect(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, w, 1, c); }
}

function draw() {
  const c = cities[current]; const w = c && wx[c.id];
  const cat = preview || (w ? category(w.code) : 'cloudy');
  const isDay = preview ? true : (w ? w.isDay : true);
  const temp = w ? w.t : 10; const wind = w ? w.wind : 10;
  const f = S.f;
  const GROUND = 126;

  // Himmel
  const skyMap = {clear: [0, 3], partly: [0, 3], cloudy: [1, 3], fog: [1, 2], drizzle: [1, 3], rain: [1, 3], snow: [1, 3], thunder: [2, 3]};
  const sky = skyMap[cat][isDay ? 0 : 1];
  rect(0, 0, 160, 144, sky);

  // Sterne / Sonne / Mond
  if (!isDay && (cat === 'clear' || cat === 'partly' || cat === 'cloudy'))
    S.stars.forEach((s, i) => { if (cat !== 'cloudy' || i % 3 === 0) px(s.x, s.y, ((f >> 4) + i) % 5 === 0 ? 2 : (i % 2 ? 0 : 1)); });
  if (cat === 'clear' || cat === 'partly') { if (isDay) drawSun(cat === 'clear' ? 124 : 118, 34, f); else drawMoon(124, 32); }

  // Hügel (Parallax)
  const hc = {0: [1, 2], 1: [2, 3], 2: [3, 3], 3: [2, 1]}[sky];
  const ho = f * 0.25;
  for (let x = 0; x < 160; x++) { const X = x + ho;
    const h = 92 - Math.round((Math.sin(X / 23) * 9 + Math.sin(X / 9.7) * 3 + Math.sin(X / 51) * 6) / 2) * 2;
    rect(x, h, 1, GROUND - h, hc[0]); px(x, h, hc[1]); }

  // Wolken
  const nCl = {clear: 1, partly: 2, cloudy: 5, fog: 2, drizzle: 4, rain: 5, snow: 4, thunder: 5}[cat];
  const spd = 0.15 + Math.min(wind, 60) / 80;
  for (let i = 0; i < nCl; i++) {
    let key = isDay ? ({thunder: 'cStorm', rain: 'cGrey', drizzle: 'cGrey', snow: 'cDay', cloudy: 'cDay', fog: 'cDay'}[cat] || 'cDay') : 'cNight';
    if (i % 2) key += '2';
    const img = SPR[key];
    const span = 160 + img.width + 20;
    const x = ((i * 61 + f * spd * (1 + (i % 3) * 0.3)) % span) - img.width;
    const y = (cat === 'clear' ? 16 : 6) + (i * 13) % 28;
    g.drawImage(img, Math.round(160 - x - img.width), y);
  }

  // Büsche + Boden
  const go = f;   // Bodengeschwindigkeit 1 px/Frame
  for (let k = -1; k < 4; k++) { const bx = Math.round(k * 64 - (go % 64) + 20); g.drawImage(isDay ? SPR.bush : SPR.bushN, bx, GROUND - 11); }
  for (let row = 0; row < 3; row++) { const ty = GROUND + row * 6; const off = (row % 2) * 4;
    for (let x = -16; x < 176; x += 8) { const tx = x - (go % 8) + off;
      rect(tx, ty, 8, 6, 2); rect(tx, ty + 5, 8, 1, 3); rect(tx + 7, ty, 1, 6, 3); px(tx, ty, 1); px(tx + 1, ty, 1); px(tx, ty + 1, 1); } }
  rect(0, GROUND - 1, 160, 1, 3);
  for (let x = -4; x < 164; x += 4) { const gx = x - (go % 4); px(gx, GROUND - 2, 3); }
  if (cat === 'snow') { rect(0, GROUND - 2, 160, 2, 0); for (let x = -6; x < 166; x += 6) { const sx = x - (go % 6); px(sx, GROUND - 3, 0); px(sx + 1, GROUND - 3, 0); } }

  // Figur
  const precip = cat === 'rain' || cat === 'drizzle' || cat === 'snow' || cat === 'thunder';
  const shiver = temp <= 0 ? ((f >> 1) & 1) : 0;
  const bx = 38 + shiver, by = GROUND - 11 - (((f >> 3) & 1) && !shiver ? 1 : 0);
  const map = isDay ? null : [1, 1, 2, 3];
  sprite(BOT.head, bx, by, map);
  sprite(((f >> 3) & 1) ? BOT.legA : BOT.legB, bx, by + 8, map);
  if (precip) { sprite(UMB, bx + 2, by - 9, map); line(bx + 8, by - 5, bx + 8, by + 6, 3); px(bx + 7, by + 6, 3); }
  if (temp >= 25 && cat === 'clear' && isDay) { const d = (f >> 2) % 6; px(bx - 1, by + 1 + d, 2); px(bx - 1, by + 2 + d, 2); }
  if (temp <= 0 && !precip) { const d = (f >> 2) % 8; px(bx + 9 + d, by + 4 - (d >> 1), 0); px(bx + 10 + d, by + 4 - (d >> 1), 0); }

  // Niederschlag
  if (cat === 'rain' || cat === 'drizzle' || cat === 'thunder') {
    const n = cat === 'drizzle' ? 30 : cat === 'rain' ? 75 : 95; const col = sky >= 2 ? 1 : (isDay ? 3 : 1);
    const fall = cat === 'drizzle' ? 2.2 : 3.6;
    for (let i = 0; i < n; i++) { const p = S.parts[i]; p.y += fall * p.s; p.x -= (0.6 + wind / 40) * p.s;
      const umb = p.x > bx + 1 && p.x < bx + 15 && p.y > by - 9 && p.y < by - 4;
      if (p.y >= GROUND - 2 || umb) { const sy = umb ? by - 10 : GROUND - 2; px(p.x - 1, sy, col); px(p.x + 1, sy, col);
        p.y = -5 - Math.random() * 30; p.x = Math.random() * 200; continue; }
      rect(p.x, p.y, 1, cat === 'drizzle' ? 2 : 3, col); }
  }
  if (cat === 'snow') {
    const col = 0;
    for (let i = 0; i < 70; i++) { const p = S.parts[i]; p.y += 0.45 * p.s; p.x += Math.sin((f + i * 17) / 18) * 0.35 - wind / 120;
      if (p.y > GROUND - 2) { p.y = -4; p.x = Math.random() * 180; }
      if (p.x < -3) p.x += 166;
      if (p.s > 1.1) { px(p.x, p.y - 1, col); px(p.x - 1, p.y, col); px(p.x + 1, p.y, col); px(p.x, p.y + 1, col); px(p.x, p.y, isDay ? 1 : 2); }
      else px(p.x, p.y, col); }
  }
  if (cat === 'fog') { const fo = (f * 0.4) % 80; g.drawImage(SPR.fog, -fo, 52); g.drawImage(SPR.fog, -fo, 8); }

  // Gewitter
  if (cat === 'thunder') {
    if (S.flash <= 0 && Math.random() < 0.015) { S.flash = 12; let x = 30 + Math.random() * 100, y = 22; const pts = [[x, y]];
      while (y < GROUND - 2) { y += 6 + Math.random() * 8; x += (Math.random() - 0.5) * 18; pts.push([x, Math.min(y, GROUND - 2)]); } S.bolt = pts; }
    if (S.flash > 0) {
      if (S.flash > 9) rect(0, 0, 160, 144, 0);
      const bc = S.flash > 9 ? 3 : 0;
      for (let i = 1; i < S.bolt.length; i++) line(S.bolt[i - 1][0], S.bolt[i - 1][1], S.bolt[i][0], S.bolt[i][1], bc, 2);
      S.flash--;
    }
  }

  // HUD
  const tc = sky >= 2 ? 0 : 3, sc = sky >= 2 ? 2 : 1;
  const name = c ? norm(c.name).slice(0, 22) : '';
  txtShadow(name, 4, 4, tc, sc);
  txtShadow(norm(preview ? SHORT[preview] : (w ? longTxt(w) : '')).slice(0, 22), 4, 11, tc, sc);
  if (!preview || w) { const ts = w ? Math.round(temp) + '°' : '--'; txtShadow(ts, 156 - txtW(ts, 2), 4, tc, sc, 2); }
  if (preview) txtShadow('DEMO', 156 - txtW('DEMO'), 16, tc, sc);
  S.f++;
}
let raf = 0, last = 0;
function loop(ts) { raf = requestAnimationFrame(loop); if (ts - last < 33) return; last = ts; draw(); }
function startAnim() { cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); }
function stopAnim() { cancelAnimationFrame(raf); raf = 0; }

/* ================= App-Icon (für Home-Bildschirm) ================= */
function makeIcon() {
  try {
    const c = document.createElement('canvas'); c.width = 180; c.height = 180; const old = g; g = c.getContext('2d');
    g.fillStyle = '#0000aa'; g.fillRect(0, 0, 180, 180);
    g.save(); g.scale(4, 4);
    rect(4, 4, 37, 37, 0); rect(4, 30, 37, 11, 2); rect(4, 29, 37, 1, 3);
    drawSun(28, 15, 0); g.drawImage(SPR.cDay2, 6, 12);
    g.restore(); g.save(); g.scale(3, 3); txt('WX', 3, 52, 0, 1); g.restore();
    g = old; $('ati').href = c.toDataURL('image/png');
  } catch (e) {}
}

/* ================= Start ================= */
function tick() { const t = hhmm(new Date()); $('clock').textContent = t; $('clock2').textContent = t; }
try { resetScene(); render(); tick(); setInterval(tick, 10000); } catch (e) { window.onerror(e.message, '', 0, 0); }
if (!cities.length) { log('WETTER-DOS bereit.', 'ok'); log('Tippe: NEU BERLIN', 'i'); }
else refreshAll();
setInterval(() => { if (!document.hidden && cities.length) refreshAll(); }, 10 * 60 * 1000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && cities.length) { const oldest = Math.min(...cities.map(c => (wx[c.id] || {time: 0}).time)); if (Date.now() - oldest > 10 * 60 * 1000) refreshAll(); }
});

}
